<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Vistoria Informatizada — Cadastro</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <header>
        <a href="index.html" class="logo">
            <img src="../imgs/logo.png" alt="Vistorias">
        </a>
        
        <nav>
            <ul>
                <li><a href="Cadastro.html">Cadastrar</a></li>
                <li><a href="Vistorias.html">Vistorias</a></li>
                <li><a href="#sobre">Sobre-nós</a></li>
            </ul>
        </nav>
    </header>

<div class="container">

    <h1>Sistema de Vistoria Informatizada</h1>

    <div id="mensagem"></div>

    <section class="card">
        <h2>Cadastro / Edição de Vistoria</h2>

        <input type="hidden" id="id">

        <label>Identificador Único (ex.: VST-001)</label>
        <input type="text" id="codigoIdentificador">

        <label>Placa do Veículo (ex.: ABC1D23)</label>
        <input type="text" id="placa">

        <label>Modelo do Veículo (ex.: Honda Civic EXL)</label>
        <input type="text" id="modelo">

        <label>Ano do Veículo</label>
        <input type="number" id="ano" placeholder="Ex.: 2022">

        <label>URL ou caminho da Foto do Veículo (ex.: ../imgs/CarroVistoria.png)</label>
        <input type="text" id="fotoUrl">

        <label>Responsável</label>
        <input type="text" id="responsavel">

        <label>Data de Abertura</label>
        <input type="date" id="dataAbertura">

        <label>Informações Iniciais para o Vistoriador</label>
        <input type="text" id="informacoesIniciais">

        <label>Descrição da Vistoria</label>
        <input type="text" id="descricao">

        <label style="display:flex;align-items:center;gap:8px;margin-bottom:12px;">
            <input type="checkbox" id="finalizada" style="width:auto;margin:0;">
            Vistoria finalizada
        </label>

        <div class="acoes">
            <button id="btnSalvar" type="button">Salvar</button>
            <button id="btnNovo" type="button">Novo</button>
            <a href="./Vistorias.html"><button type="button">Ver Vistorias e Histórico</button></a>
        </div>
    </section>

</div>

<script type="module" src="./js/app.js"></script>

</body>
</html>
