<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vistorias</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <a href="index.html" class="logo">
            <img src="../imgs/logo.png" alt="Vistorias">
        </a>

        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="Cadastro.html">Cadastrar</a></li>
                <li><a href="Vistorias.html">Vistorias</a></li>
            </ul>
        </nav>
    </header>

    <div class="corpo">
        <div><img src="../imgs/CarroVistoria.png" alt="Faça seu agendamento"></div>
        <div class="conteudo">
            <h1>
                O lugar mais confiavel para vistoriar seu carro
            </h1>
            <h2>
                Controle de vistorias veiculares, acompanhamento de status e registro de ocorrências por perfil de
                acesso.
            </h2>

            <div class="botoes">
                <a href="./Vistorias.html"><button type="button">Consultar Vistorias</button></a>
            </div>

            <h2 class="texto2">
                Cadastre vistorias, adicione ocorrencias e acompanhe o andamento do vistoriamento do seu carro!
            </h2>

            <div class="botoes">
                <a href="./Cadastro.html"><button type="button">Cadastrar Vistorias</button></a>
            </div>
        </div>
    </div>

    <script type="module">
        import { obterSessao, renderizarBarraUsuario } from "./js/auth.js";

        window.addEventListener("DOMContentLoaded", () => {
            renderizarBarraUsuario();

            const usuario = obterSessao();
            const btnLoginHome = document.getElementById("btnLoginHome");
            if (usuario && btnLoginHome) {
                btnLoginHome.style.display = "none";
            }

            if (usuario && usuario.perfil !== "ANALISTA") {
                document.querySelectorAll('a[href*="Cadastro.html"]').forEach(el => {
                    el.style.display = "none";
                });
            }
        });
    </script>

    <script src="js/script.js"></script>
</body>

</html>
